<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Polymer Electrolyte Data Mining: an interactive explorer for polymer-electrolyte conductivity data from UC Santa Barbara / NSF MRSEC."
    />
    <title>Polymer Electrolyte Data Mining</title>
    <script>
      // Apply the persisted (or system) theme before first paint so there is
      // no flash of the wrong theme. Keep the storage key in sync with
      // THEME_STORAGE_KEY in src/components/theme/ThemeProvider.tsx.
      (function () {
        try {
          var KEY = "pe-dm-theme";
          var stored = localStorage.getItem(KEY);
          var theme = stored === "light" || stored === "dark" ? stored : "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = theme === "dark" || (theme === "system" && prefersDark);
          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = isDark ? "dark" : "light";
        } catch (_error) {
          // localStorage/matchMedia can throw in locked-down environments;
          // fall back to the default light theme rather than block render.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
